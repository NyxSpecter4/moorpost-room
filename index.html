<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Moorpost</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#14110c;color:#f3ead8;font:18px/1.45 Georgia,serif}main{max-width:760px;margin:auto;padding:16px}canvas{width:100%;height:240px;background:#000;border:1px solid #8a7048;display:block}button,input{font:inherit;background:#2a231c;color:#f3ead8;border:1px solid #8a7048;padding:8px;margin:4px 4px 0 0}.say{color:#e2c27a}</style></head><body><main>
<h1>Moorpost</h1>
<p>One room. One copied word. The flag looks like moorpost{word}. A clean seal is not the word.</p>
<canvas id="c" width="640" height="240"></canvas>
<p id="where">In the hall. Tap the buttons.</p>
<div><button type="button" id="up">Forward</button><button type="button" id="left">Left</button><button type="button" id="right">Right</button><button type="button" id="down">Back</button></div>
<p class="say" id="line">Timur: I carry them from the chest to the rail. I do not cut them.</p>
<div id="talk"><button data-q="seal">The seal</button><button data-q="birds">The birds</button><button data-q="crates">The crates</button><button data-q="tablet">The tablet</button></div>
<p>Tablet: <b>MHSVJU</b>. Shift each letter back 7.</p>
<input id="word" placeholder="word that belongs"><input id="why" placeholder="how you could be wrong"><button id="send">Hand it to the clerk</button>
<p id="log">Nothing written.</p>
<script>var lines={seal:"The wax is whole. That is all a seal says.",birds:"Altai had seven on the ridge. If you hear that word again, it did not grow here.",crates:"Seven left the boat at Sarai. I watched them.",tablet:"The letters are shifted forward by seven. I will not read them for you."};document.getElementById("talk").onclick=function(e){var k=e.target.getAttribute("data-q");if(!k)return;document.getElementById("line").textContent="Timur: "+lines[k];};var map=["########","#......#","#..#...#","#......#","#....F.#","########"];var x=1.5,y=1.5,a=0,cv=document.getElementById("c"),ctx=cv.getContext("2d");function cast(){var w=cv.width,h=cv.height;ctx.fillStyle="#1b2430";ctx.fillRect(0,0,w,h/2);ctx.fillStyle="#3a2a1c";ctx.fillRect(0,h/2,w,h/2);for(var col=0;col<w;col++){var ra=a-0.5+col/w,dx=Math.cos(ra),dy=Math.sin(ra),dist=0,hit=0;while(dist<12&&!hit){dist+=0.02;var mx=Math.floor(x+dx*dist),my=Math.floor(y+dy*dist);if(map[my]&&map[my][mx]==="#")hit=1;}var line=Math.min(h,h/(dist+0.1)),shade=Math.max(20,220-dist*28);ctx.fillStyle="rgb("+shade+","+(shade-20)+","+(shade-40)+")";ctx.fillRect(col,(h-line)/2,1,line);}document.getElementById("where").textContent=map[Math.floor(y)][Math.floor(x)]==="F"?"At the chest.":"In the hall.";}function move(s,t){a+=t;var nx=x+Math.cos(a)*s,ny=y+Math.sin(a)*s;if(map[Math.floor(ny)]&&map[Math.floor(ny)][Math.floor(nx)]!=="#"){x=nx;y=ny;}cast();}addEventListener("keydown",function(e){if(["ArrowUp","w"].indexOf(e.key)>=0)move(0.12,0);if(["ArrowDown","s"].indexOf(e.key)>=0)move(-0.12,0);if(["ArrowLeft","a"].indexOf(e.key)>=0)move(0,-0.08);if(["ArrowRight","d"].indexOf(e.key)>=0)move(0,0.08);});cast();function bind(id,step,turn){document.getElementById(id).onclick=function(){move(step,turn);};}bind("up",0.12,0);bind("down",-0.12,0);bind("left",0,-0.08);bind("right",0,0.08);document.getElementById("send").onclick=function(){var word=document.getElementById("word").value.toLowerCase();var why=document.getElementById("why").value.trim();var at=map[Math.floor(y)][Math.floor(x)]==="F";var log=document.getElementById("log");if(why.length<8){log.textContent="REFUSED. Say how you could be wrong.";return;}if(!at){log.textContent="REFUSED. Not at the chest.";return;}if(word.indexOf("falcon")>=0){log.textContent="REFUSED. Falcon is Altai's word.";return;}if(word.indexOf("thunder")<0){log.textContent="REFUSED. Nothing written.";return;}log.textContent="STAMPED. Flag: moorpost{volga_word_thunder}";};</script></main></body></html>
